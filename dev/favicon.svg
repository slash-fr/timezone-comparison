    <rect width="16" height="16" fill="url(#fillGradient)" rx="1" ry="1"/>
    <rect x="6" y="3" width="8" height="2" fill="white" filter="url(#drop-shadow)" rx="0.25" ry="0.25"/>
    <rect x="4" y="7" width="8" height="2" fill="white" filter="url(#drop-shadow)" rx="0.25" ry="0.25"/>
